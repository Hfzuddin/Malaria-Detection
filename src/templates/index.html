<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malaria Detection System</title>
    <!-- Import Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          }
        }
      }
    </script>
    
    <!-- Custom CSS Overrides -->
    <style>
      body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f9fafb; /* gray-50 */
      }
      html.dark body {
        background-color: #09090b; /* zinc-950 */
      }
      
      /* Spinner Animation */
      .spinner {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 4px solid rgba(99, 102, 241, 0.2);
        border-top-color: #4f46e5;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="text/babel" src="/static/components/Navbar.jsx"></script>
    <script type="text/babel" src="/static/components/Dashboard.jsx"></script>
    <script type="text/babel" src="/static/components/ScannedResults.jsx"></script>
    <script type="text/babel" src="/static/components/Gallery.jsx"></script>
    <script type="text/babel" src="/static/app.jsx"></script>
  </body>
</html>
